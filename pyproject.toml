[project]
name = "setestat"
version = "0.0.1"
authors = [
    { name = "Alastair Moore", email = "alastair.h.moore@imperial.ac.uk" }
]
requires-python = ">=3.9"
dependencies = [
    "click",
    "confuse",
    "pandas",
    "numpy",
    "pyinstaller",
    "pysimplegui",
    "pyyaml",
    "jack-client",
    "python-osc",
    "pylsl",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "black",
    "pip-tools",
    "matplotlib",
]